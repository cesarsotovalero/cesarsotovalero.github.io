name: Website

on:
  push:
    branches:
      - master
  pull_request: # build and check every pull request; only pushes to master deploy
  workflow_dispatch: # allow manual re-runs from the Actions tab

permissions:
  pages: write # allow deploy-pages to publish
  id-token: write # allow OIDC for Pages deploy

env:
  RUBY_VERSION: 3.4.4

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # A normal build takes ~5 min; fail fast instead of hanging for an hour.
    timeout-minutes: 30
    # Only the newest commit gets deployed, so cancel builds made obsolete by a newer push.
    concurrency:
      group: website-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml pillow fonttools brotli

      - name: Generate talks.yml from talks.md
        run: python scripts/sync_talks_from_page.py

      - name: Generate thumbnails (post covers and LinkedIn images)
        run: python scripts/make_thumbnails.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false # caching handled by the Jekyll action

      # ImageMagick (for rmagick / jekyll-responsive-image) and minify (post-build minification).
      # The .deb files are cached per OS and month, so most builds install them without touching
      # the Ubuntu mirrors, which sometimes stall for 10-20 minutes. (GitHub runs several image
      # versions at once, so the exact image version would make the cache miss most of the time.)
      - name: Identify the runner image
        id: runner-image
        run: echo "id=${ImageOS:-unknown}-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore cached system packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-${{ steps.runner-image.outputs.id }}-libmagickwand-dev-minify-v2

      # Cache hit: install the cached .deb files with dpkg, offline (apt itself would consult its
      # stale package index and try to download). Cache miss, or if that fails: the mirrors, with
      # time-boxed downloads and a fallback to archive.ubuntu.com, because a stalled runner mirror
      # previously hung this step for ~1h before failing with exit code 100.
      - name: Install system packages (ImageMagick, minify)
        timeout-minutes: 15
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          # Skip man-db index rebuilds triggered by every package install.
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update

          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)

          # minify has no Recommends, so a single install is equivalent to the old two steps.
          PACKAGES=(libmagickwand-dev minify)

          download() {
            sudo timeout 240 apt-get "${APT_OPTS[@]}" update -qq &&
              sudo timeout 420 apt-get "${APT_OPTS[@]}" install --download-only --fix-broken --yes "${PACKAGES[@]}"
          }

          install_from_cache() {
            [ "$CACHE_HIT" = "true" ] || return 1
            cd ~/apt-debs || return 1
            # Only packages the image lacks, so a cached file never replaces a newer installed one.
            local debs=() deb name
            for deb in ./*.deb; do
              name=$(dpkg-deb -f "$deb" Package) || return 1
              [ "$(dpkg-query -W -f='${db:Status-Abbrev}' "$name" 2>/dev/null)" = "ii " ] || debs+=("$deb")
            done
            if [ "${#debs[@]}" -gt 0 ]; then
              # A second pass settles packages whose dependencies came later in the first one.
              { sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "${debs[@]}" > /dev/null ||
                sudo env DEBIAN_FRONTEND=noninteractive dpkg -i "${debs[@]}" > /dev/null; } || return 1
            fi
            # Every package must be fully installed ("ii"), not just unpacked.
            for p in "${PACKAGES[@]}"; do
              [ "$(dpkg-query -W -f='${db:Status-Abbrev}' "$p" 2>/dev/null)" = "ii " ] || return 1
            done
          }

          if install_from_cache; then
            echo "Installed ${PACKAGES[*]} from the package cache."
          else
            if [ "$CACHE_HIT" = "true" ]; then
              echo "::warning::Cached packages did not install; using the Ubuntu mirrors"
            fi
            if ! download; then
              echo "::warning::Default Ubuntu mirror failed; retrying with archive.ubuntu.com"
              sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
                /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
              download
            fi
            # Everything is already downloaded, so installation needs no network.
            sudo apt-get "${APT_OPTS[@]}" install --yes --no-download --fix-broken "${PACKAGES[@]}"
            # Keep the downloaded files for the next builds on this runner image.
            mkdir -p ~/apt-debs
            cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          fi

      - name: Build Jekyll site (with all plugins)
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: true # caches vendor/bundle for speed
        env:
          YOUTUBE_API_TOKEN: ${{ secrets.YOUTUBE_API_TOKEN }}
          GMAIL: ${{ secrets.CESAR_PERSONAL_GMAIL }}

      # Keep only the Font Awesome icons the pages use (CSS and fonts: about 217 KB -> 10 KB).
      # Never fails the deploy: on any error the original files stay.
      - name: Trim Font Awesome to the icons in use
        run: python scripts/trim_fontawesome.py _site

      - name: Build the search index (Pagefind)
        run: npx -y pagefind@1.3.0 --site _site

      - name: Validate generated site smoke checks
        run: python3 scripts/validate_site_smoke.py

      # GitHub's Ubuntu runners ship Google Chrome, so Playwright drives it instead of downloading
      # its own Chromium and its system libraries (another apt round-trip that could stall).
      - name: Check pages for JavaScript errors
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          if command -v google-chrome >/dev/null 2>&1; then
            export PLAYWRIGHT_CHANNEL=chrome
          else
            npx playwright install --with-deps chromium
          fi
          node scripts/check_console_errors.js _site

      # Every page: internal links, anchors and images. Downloads, font demos and the
      # standalone visualizations are not site pages and are skipped.
      - name: Check internal links and images on the whole site
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          bundle exec htmlproofer ./_site \
            --checks Links,Images --disable-external --allow-hash-href \
            --ignore-empty-alt --ignore-empty-mailto --no-enforce-https --assume-extension .html \
            --ignore-files "/\/fonts\//,/\/files\//,/\/visualizations\//,/\/asciinema\//,/\/pagefind\//" \
            --ignore-urls "/\/presentations\/assert-13th/"

      - name: Minify HTML files
        run: |
          minify \
            --type=html \
            --recursive \
            --match '\.html' \
            --output="./" \
            --html-keep-conditional-comments \
            --html-keep-default-attrvals \
            --html-keep-document-tags \
            --html-keep-end-tags \
            --verbose \
            "./_site/"

      - name: Minify JSON files
        run: |
          minify --type=json --recursive --match '\.json' --output="./" --verbose "./_site/" || true

      - name: Minify JavaScript files
        run: |
          minify --mime=application/javascript --recursive --match '\.js' --output="./" --verbose "./_site/js" || true

      - name: Minify CSS files
        run: |
          minify --type=css --recursive --match '\.css' --output="./" --verbose "./_site/css" || true

      - name: Create CNAME file
        run: echo 'www.cesarsotovalero.net' > _site/CNAME

      # GitHub Pages documents a 1 GB limit for published sites.
      - name: Report site size
        run: |
          size_mb=$(du -sm _site | cut -f1)
          echo "Site size: ${size_mb} MB"
          du -sm _site/* | sort -rn | head -5
          if [ "$size_mb" -gt 1000 ]; then
            echo "::warning::The built site is ${size_mb} MB; GitHub Pages documents a 1 GB limit."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site/

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Never cancel a deployment that is already in progress; queue the next one instead.
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://www.cesarsotovalero.net

    steps:
      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@v5

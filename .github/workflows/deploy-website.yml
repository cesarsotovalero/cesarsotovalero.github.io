name: Website

on:
  push:
    branches:
      - master
  workflow_dispatch: # allow manual re-runs from the Actions tab

permissions:
  pages: write # allow deploy-pages to publish
  id-token: write # allow OIDC for Pages deploy

env:
  RUBY_VERSION: 3.4.4

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    # A normal build takes ~5 min; fail fast instead of hanging for an hour.
    timeout-minutes: 30
    # Only the newest commit gets deployed, so cancel builds made obsolete by a newer push.
    concurrency:
      group: website-build-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate talks.yml from talks.md
        run: python scripts/sync_talks_from_page.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false # caching handled by the Jekyll action

      # One apt round-trip for everything the build needs (ImageMagick for rmagick /
      # jekyll-responsive-image, minify for the post-build minification).
      # Downloads are time-boxed and fall back to archive.ubuntu.com, because a stalled
      # runner mirror previously hung this step for ~1h before failing with exit code 100.
      - name: Install system packages (ImageMagick, minify)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Skip man-db index rebuilds triggered by every package install.
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update

          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)

          # minify has no Recommends, so a single install is equivalent to the old two steps.
          PACKAGES=(libmagickwand-dev minify)

          download() {
            sudo timeout 240 apt-get "${APT_OPTS[@]}" update -qq &&
              sudo timeout 420 apt-get "${APT_OPTS[@]}" install --download-only --yes "${PACKAGES[@]}"
          }

          if ! download; then
            echo "::warning::Default Ubuntu mirror failed; retrying with archive.ubuntu.com"
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            download
          fi

          # Everything is already downloaded, so installation needs no network.
          sudo apt-get "${APT_OPTS[@]}" install --yes --no-download "${PACKAGES[@]}"

      - name: Build Jekyll site (with all plugins)
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: true # caches vendor/bundle for speed
          prettier: false # skip extra formatting
        env:
          GISCUS_DATA_REPO_ID: ${{ secrets.GISCUS_DATA_REPO_ID }}
          GISCUS_GISCUS_DATA_CATEGORY_ID: ${{ secrets.GISCUS_DATA_REPO_ID }}
          YOUTUBE_API_TOKEN: ${{ secrets.YOUTUBE_API_TOKEN }}
          GMAIL: ${{ secrets.CESAR_PERSONAL_GMAIL }}

      - name: Validate generated site smoke checks
        run: python3 scripts/validate_site_smoke.py

      - name: Validate critical pages (internal links/images)
        run: |
          bundle exec htmlproofer ./_site/index.html --checks Links,Images --disable-external --allow-hash-href --ignore-empty-alt --ignore-empty-mailto --no-enforce-https --assume-extension .html
          bundle exec htmlproofer ./_site/about-me.html --checks Links,Images --disable-external --allow-hash-href --ignore-empty-alt --ignore-empty-mailto --no-enforce-https --assume-extension .html
          bundle exec htmlproofer ./_site/search.html --checks Links,Images --disable-external --allow-hash-href --ignore-empty-alt --ignore-empty-mailto --no-enforce-https --assume-extension .html

      - name: Minify HTML files
        run: |
          minify \
            --type=html \
            --recursive \
            --match '\.html' \
            --output="./" \
            --html-keep-conditional-comments \
            --html-keep-default-attrvals \
            --html-keep-document-tags \
            --html-keep-end-tags \
            --verbose \
            "./_site/"

      - name: Minify JSON files
        run: |
          minify --type=json --recursive --match '\.json' --output="./" --verbose "./_site/" || true

      - name: Minify JavaScript files
        run: |
          minify --mime=application/javascript --recursive --match '\.js' --output="./" --verbose "./_site/js" || true

      - name: Minify CSS files
        run: |
          minify --type=css --recursive --match '\.css' --output="./" --verbose "./_site/css" || true

      - name: Create CNAME file
        run: echo 'www.cesarsotovalero.net' > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Never cancel a deployment that is already in progress; queue the next one instead.
    concurrency:
      group: website-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://www.cesarsotovalero.net

    steps:
      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@v4

name: Website

on:
  push:
    branches:
      - master

permissions:
  pages: write # allow deploy-pages to publish
  id-token: write # allow OIDC for Pages deploy

env:
  RUBY_VERSION: 3.4.4

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate talks.yml from talks.md
        run: python scripts/sync_talks_from_page.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: false # caching handled by the Jekyll action

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev

      - name: Build Jekyll site (with all plugins)
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: true # caches vendor/bundle for speed
          prettier: false # skip extra formatting
        env:
          GISCUS_DATA_REPO_ID: ${{ secrets.GISCUS_DATA_REPO_ID }}
          GISCUS_GISCUS_DATA_CATEGORY_ID: ${{ secrets.GISCUS_DATA_REPO_ID }}
          YOUTUBE_API_TOKEN: ${{ secrets.YOUTUBE_API_TOKEN }}
          GMAIL: ${{ secrets.CESAR_PERSONAL_GMAIL }}

      - name: Install Minify
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes minify

      - name: Minify HTML files
        run: |
          minify \
            --type=html \
            --recursive \
            --match '\.html' \
            --output="./" \
            --html-keep-conditional-comments \
            --html-keep-default-attrvals \
            --html-keep-document-tags \
            --html-keep-end-tags \
            --verbose \
            "./_site/"

      - name: Minify JSON files
        run: |
          minify --type=json --recursive --match '\.json' --output="./" --verbose "./_site/" || true

      - name: Minify JavaScript files
        run: |
          minify --mime=application/javascript --recursive --match '\.js' --output="./" --verbose "./_site/js" || true

      - name: Minify CSS files
        run: |
          minify --type=css --recursive --match '\.css' --output="./" --verbose "./_site/css" || true

      - name: Create CNAME file
        run: echo 'www.cesarsotovalero.net' > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://www.cesarsotovalero.net

    steps:
      - name: Deploy artifact to GitHub Pages
        uses: actions/deploy-pages@v4

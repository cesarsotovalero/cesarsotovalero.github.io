# Content for the booking page (/book), rendered by _pages/book.md.

hero:
  eyebrow: "One-to-one sessions"
  title: "Book a session with me"
  subtitle: "A private call about your problem: an AI project, a career decision, or your next interview. You get my direct opinion during the call and a written summary afterwards."
  image: "/img/pages/cesar/cesar-profile-2024-200x200px.jpg"
  name: "César Soto Valero"
  credentials:
    - "Lead Data Scientist in investment banking"
    - "PhD in Computer Science, KTH"
    - "30+ research papers"
    - "Keynote speaker"
  cta_label: "See sessions"
  price_hint: "From €79"

# `price` and `currency` feed the structured data; `price_label` is what visitors see.
# `booking_url` must match an event type on Cal.com.
offers:
  - key: "mentorship"
    title: "Career mentorship"
    audience: "For engineers, researchers and career changers"
    duration: "60 min"
    price: 99
    currency: "EUR"
    price_label: "€99"
    description: "Work through a career decision with someone who has made the move from research to industry. You leave with a 30-day action plan."
    bullets:
      - "A career roadmap with concrete next steps"
      - "How to position yourself for the roles you want"
      - "Direct feedback on your CV, profile or approach"
    cta_label: "Book mentorship"
    booking_url: "https://cal.com/cesarsotovalero/mentorship"

  - key: "mock-interview"
    title: "AI engineer mock interview"
    audience: "For candidates preparing AI and ML interviews"
    duration: "60 min"
    price: 119
    currency: "EUR"
    price_label: "€119"
    description: "A realistic interview, followed by honest, structured feedback on where you lose points and how to fix it."
    bullets:
      - "Your choice of round: behavioural, system design, ML and AI architecture, or coding"
      - "Strengths and gaps you can act on straight away"
      - "Written follow-up with what to improve first"
    cta_label: "Book mock interview"
    booking_url: "https://cal.com/cesarsotovalero/mock-interview"

  - key: "career-advice"
    title: "AI advisory session"
    audience: "For founders, managers and teams adopting AI"
    duration: "45 min"
    price: 79
    currency: "EUR"
    price_label: "€79"
    description: "Bring an AI problem from your business: a use case to assess, an architecture to review, or a rollout that has stalled. You leave with clear next steps."
    bullets:
      - "A practical, low-risk plan to put AI to work"
      - "An outside view on your architecture, evals or team setup"
      - "Recommendations you can act on straight away"
    cta_label: "Book advisory session"
    booking_url: "https://cal.com/cesarsotovalero/career-advice"


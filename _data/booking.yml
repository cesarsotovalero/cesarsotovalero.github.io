hero:
  eyebrow: "Book a session"
  title: "Work with César 1:1"
  subtitle: "I've helped engineers, researchers, and career-changers land roles at top tech companies. Get the same direct, no-fluff guidance in a private session."
  image: "/img/pages/cesar/cesar-profile-2024-200x200px.jpg"

offers:
  - key: "career-advice"
    title: "Career Advice"
    duration: "45 minutes"
    price: "EUR 79"
    description: "Have a specific decision, blocker, or dilemma? Get a focused answer and walk away knowing what to do next."
    bullets:
      - "Should I accept this offer? Should I switch fields? How do I negotiate?"
      - "LinkedIn/Resume review with actionable edits"
      - "Practical recommendations you can implement today"
    cta_label: "Book career advice"
    booking_url: "https://cal.com/cesarsotovalero/career-advice"
    payment_note: "Payment is collected during booking."

  - key: "mentorship"
    title: "1:1 Mentorship Session"
    duration: "60 minutes"
    price: "EUR 99"
    description: "Leave with a clear 30-day action plan tailored to your career goals - whether you're pivoting, job-hunting, or growing in your current role."
    bullets:
      - "Personalized career roadmap with concrete next steps"
      - "Positioning strategy: how to stand out in your target market"
      - "Direct feedback on your profile, resume, or approach"
    cta_label: "Book mentorship"
    booking_url: "https://cal.com/cesarsotovalero/mentorship"
    payment_note: "Payment is collected during booking."

  - key: "mock-interview"
    title: "Mock Job Interview"
    duration: "60 minutes"
    price: "EUR 119"
    description: "Simulate a real technical or behavioral interview and get honest, structured feedback on exactly where you're losing points - and how to fix it."
    bullets:
      - "Realistic interview simulation (behavioral, system design, or coding)"
      - "Detailed strengths and gap analysis you can act on immediately"
      - "Written follow-up with improvement priorities"
    cta_label: "Book mock interview"
    booking_url: "https://cal.com/cesarsotovalero/mock-interview"
    payment_note: "Payment is collected during booking."

testimonials:
  - quote: "César gave me very concrete feedback and a clear action plan. I left the session knowing exactly what to do next."
    author: "Anonymous client"
    role: "Data Scientist"
  - quote: "The mock interview was practical and honest. It helped me identify blind spots quickly and improve my confidence."
    author: "Anonymous client"
    role: "Software Engineer"
  - quote: "Strong guidance, no fluff. The session helped me reframe my strategy and communicate my value better."
    author: "Anonymous client"
    role: "Product Manager"

faq:
  - question: "How do booking and payment work?"
    answer: "Pick your session, choose a time slot, and complete payment in the booking flow."
  - question: "Can I reschedule?"
    answer: "Yes. Please use the rescheduling link in your confirmation email."
  - question: "What is the cancellation policy?"
    answer: "You can set your policy here before launch (for example, free cancellation up to 24 hours before the session)."

footer_cta:
  title: "Not sure which session to choose?"
  text: "Start with a career advice session and we can decide the best next step together."
  button_label: "Book career advice"
  button_url: "https://cal.com/cesarsotovalero/career-advice"

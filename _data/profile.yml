# One-paragraph answer to "Who is César Soto Valero?" (third person, quotable).
summary: >-
  César Soto Valero is a Lead Data Scientist at SEB, one of the largest banks in the Nordics,
  where he drives AI solutions within the Investment Banking division. He works on applied AI
  for finance: financial document intelligence, agentic workflows, and evaluation of AI systems
  in a regulated environment. He previously spent three years in Financial Crime Prevention at SEB,
  building and maintaining real-time AI/ML systems used by millions of customers. He holds a PhD in
  Computer Science from KTH Royal Institute of Technology (2023), has authored 30+ research papers
  with 1,000+ citations, and is a keynote speaker and open-source author based in Stockholm, Sweden.


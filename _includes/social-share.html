<section class="share-section" aria-label="Share this post">
   <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url | url_encode }}"
      class="btn btn-my-icon btn-linkedin" title="Share on LinkedIn">
      <span id="share-linkedin" class="fab fa-linkedin-in" aria-hidden="true"></span>
      <span class="sr-only">Share on LinkedIn</span>
   </a>

   <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}+{{ page.url | absolute_url }}"
      class="btn btn-my-icon btn-twitter" title="Share on X">
      <span id="share-twitter" class="fab fa-twitter" aria-hidden="true"></span>
      <span class="sr-only">Share on X</span>
   </a>

   <a href="https://www.reddit.com/submit?url={{ page.url | absolute_url | url_encode }}"
      class="btn btn-my-icon btn-reddit" title="Share on Reddit">
      <span class="fab fa-fw fa-reddit" aria-hidden="true"></span>
      <span class="sr-only">Share on Reddit</span>
   </a>

   <a href="https://news.ycombinator.com/submitlink?u={{ page.url | absolute_url | url_encode }}&amp;t={{ page.title | url_encode }}"
      class="btn btn-my-icon btn-hn" title="Share on Hacker News">
      <i class="fab fa-hacker-news-square" aria-hidden="true"></i>
      <span class="sr-only">Share on Hacker News</span>
   </a>

   <button type="button" class="btn btn-my-icon btn-copy-link" data-url="{{ page.url | absolute_url }}" title="Copy link">
      <i class="fas fa-link" aria-hidden="true"></i>
      <span class="btn-copy-link-label">Copy link</span>
   </button>
</section>

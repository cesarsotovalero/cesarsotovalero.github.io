{% comment %}
  Google Tag Manager, configured with `gtm:` in _config.yml. Loaded only in production builds.
  This is Google's current install snippet, which has no <noscript> part for the <body>.
{% endcomment %}
{% if jekyll.environment == "production" and site.gtm and site.gtm != "" %}
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id={{ site.gtm }}"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->
{% endif %}

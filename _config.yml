name: cesarsotovalero.net
url: "https://www.cesarsotovalero.net"
title: "César Soto Valero"
description: "Applied AI for finance, AI engineering, and software research by César Soto Valero"
keywords: "applied AI for finance,investment banking,AI engineering,machine learning,software engineering,research,java,python"
logo: https://www.cesarsotovalero.net/img/pages/cesar/avatar-icon-2024-stroke.png

# The navbar, mobile menu, section tabs and footer sitemap are defined in _data/navigation.yml.

# Image to show in the navigation bar - image must be a square (width = height)
# Remove this parameter if you don't want an image in the navbar
avatar: "/img/pages/cesar/cesar-profile-2024-200x200px.jpg"

# If you want to have an image logo in the top-left corner instead of the title text,
# then specify the following parameter
# title-img: /path/to/image

# --- Footer options --- #

# Change all these values or delete the ones you don't want.
# Important: you must keep the "name" parameter, everything else you can remove
author:
  name: César Soto Valero
  github: cesarsotovalero
  twitter: cesarsotovalero
  linkedin: cesarsotovalero
  stackoverflow: 10480869/cesarsotovalero?tab=profile
  youtube: channel/UCR4rI98w6-MqYoCS6jR9LGg
  email: NaN
  reddit: NaN
  snapchat: NaN
  instagram: NaN
  spotify: NaN
  telephone: NaN

twitter:
  username: cesarsotovalero
  card: summary

# Select which links to show in the footer
footer-links-active:
  rss: true
  facebook: false
  email: false
  twitter: true
  google-plus: false
  github: true
  reddit: false
  linkedin: true
  xing: false
  stackoverflow: true
  snapchat: false
  instagram: false
  youtube: true
  spotify: false
  telephone: false
  steam: false
  twitch: false
  yelp: false

# Select which share links to show in posts
share-links-active:
  twitter: true
  facebook: true
  linkedin: true

social:
  name: César Soto Valero
  links:
    - https://twitter.com/cesarsotovalero
    - https://www.facebook.com/cesar.sotovalero.9/
    - https://se.linkedin.com/in/cesarsotovalero
    - https://github.com/cesarsotovalero

# How to display the link to the website in the footer
# Remove this if you don't want a link in the footer

# --- Misc --- #

# Web analytics (see _includes/analytics.html). Loaded only in production builds.
# provider: one of ga4, plausible, goatcounter. Empty = no analytics.
# The old Universal Analytics property (UA-107061705-1) stopped collecting data in July 2023.
analytics:
  provider: ""
  ga4_measurement_id: ""   # e.g. "G-XXXXXXXXXX"
  plausible_domain: ""     # e.g. "cesarsotovalero.net"
  goatcounter_code: ""     # e.g. "cesarsotovalero" for cesarsotovalero.goatcounter.com

# Social preview image for pages that don't set `image` (generated by scripts/make_social_card.py)
social-card:
  image: /img/social/default-card.jpg
  alt: "César Soto Valero, Lead Data Scientist at SEB, applied AI for finance"

# Google Tag Manager ID
#gtm: ""

# Facebook App ID
# fb_app_id: ""

# Excerpt Word Length
# Truncates the excerpt to the specified number of words on the index page
excerpt_length: 50

# Character used to separate site title and description in HTML document title
# and RSS feed title
title-separator: ""

# --- Don't need to touch anything below here (but you can if you want) --- #

# Output options (more information on Jekyll's site)
encoding: utf-8
timezone: "Europe/Stockholm"
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
highlighter: rouge
syntax_highlighter_opts:
  block:
    line_numbers: true
permalink: /blog/:title.html
#paginate: 20
#paginate_path: "/blog/page:num/"
excerpt_separator: <!--more-->

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true  # add comments to all blog posts
      social-share: true # add social media sharing buttons to all blog posts
      carbonads: true
      before-content: [carbonads.html]
  # Keep downloads, assets and code exercises out of the sitemap (they are not site pages).
  - { scope: { path: "files" }, values: { sitemap: false } }
  - { scope: { path: "chore" }, values: { sitemap: false } }
  - { scope: { path: "fonts" }, values: { sitemap: false } }
  - { scope: { path: "img" }, values: { sitemap: false } }
  - { scope: { path: "assets" }, values: { sitemap: false } }
  - { scope: { path: "scripts" }, values: { sitemap: false } }
  -
    scope:
      path: "" # all files
    values:
      layout: "page"
      show-avatar: false # the large portrait is shown on About (and the homepage) only
      carbonads: true
      before-content: [carbonads.html]

# Keep the search index (built by Pagefind after Jekyll) across `jekyll serve` rebuilds.
keep_files:
  - .git
  - .svn
  - pagefind

# Use tags pages (not recommended if you are deploying via GitHub pages, only set to true if deploying locally with ruby)
link-tags: false


# This files will be included in the gh-pages
include:
  - _pages
  - .well-known
  - yandex_640034aaee9b8f83.html
  - google974bdea481135366.html

# Exclude these files from production site
exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
  - Rakefile
  - httpd.conf
  - id_rsa.enc
  - s3cfg.enc
  - uml
  - node_modules
  - _site
  - run_jekyll.sh
  - tag_generator.py
  - .ruby-version
  - vendor
  - feed.xml
  - "fonts/unused-fonts"
  # Not part of the website: exercises, notebooks, helper scripts.
  - chore
  - scripts
  - run_jekyll.ps1

plugins:
  - jekyll-feed
  - jemoji
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-responsive-image
  - jekyll-seo-tag
  - jekyll-last-modified-at
  - jekyll-toc

toc:
  ordered_list: true
  # Post sections are h2: _plugins/post_headings.rb shifts post headings down one level.
  min_level: 2
  max_level: 2

# Optional. The default date format, used if none is specified in the tag.
last-modified-at:
  date-format: '%d-%b-%y'

# jekyll-feed
feed:
  title: cesarsotovalero.net
  subtitle: César Soto Valero

sass:
  style: compressed
  deploy_style: compressed

# jekyll-responsive-image @see https://github.com/wildlyinaccurate/jekyll-responsive-image#templates
responsive_image:
  template: _includes/picture-responsive.html
  default_quality: 80
  sizes:
    - width: 640
    - width: 768
    - width: 1024
    - width: 1366
    - width: 1600
    - width: 1920
  strip: true

# To check for broken external links, run the following in the CLI:
# gem install html-proofer
# htmlproofer ./_site --only-4xx --check-external-hash --url-ignore '/^\/(?!\/)/'

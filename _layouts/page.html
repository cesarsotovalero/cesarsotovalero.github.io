---
layout: base
---

<div class="header-hiddable">
   {% include header.html type="page" %}
</div>

{% include section-nav.html %}

<div class="container{% if page.title_list %} title-list{% endif %}" role="main" id="main" tabindex="-1"{% unless page.noindex or page.robots == "noindex" or page.pagefind == false %} data-pagefind-body{% endunless %}>
   <div class="row">
      <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
         {{ content }}
      </div>
   </div>
</div>


<!-- https://www.bryanbraun.com/anchorjs/ -->
<script>
   document.addEventListener('DOMContentLoaded', function () {
      if (!window.anchors) return;
      anchors.options = {
         position: 'left'
      };
      anchors.add('h1:not(.no-anchor)', 'h2', 'h3');
   });
</script>
